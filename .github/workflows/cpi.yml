name: L.I.S.A. CPI Contract CI

on:
  pull_request:
    branches: [ main, feat/cross-project-intelligence-foundation, feat/cpi-06-governed-execution, feat/cpi-06-2-execution-history ]
    paths:
      - "projects/**"
      - "cli/**"
      - "tests/test_project_*.py"
      - "tests/test_ne_014_1_input_classifier.py"
      - ".github/workflows/cpi.yml"
  push:
    branches: [ feat/cross-project-intelligence-foundation, feat/cpi-06-governed-execution, feat/cpi-06-1-recovery-validation, feat/cpi-06-2-execution-history ]

jobs:
  cpi-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run project registry and CLI tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_project_*.py"
      - name: Run deterministic project command classification tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_ne_014_1_input_classifier.py"

  architecture-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run full architecture and unit suite
        run: PYTHONPATH=. python -m unittest discover -s tests
      - name: Run integration suite
        run: PYTHONPATH=. python -m unittest discover -s tests/integration

